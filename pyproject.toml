[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typesafe-gemma"
version = "0.1.0"
description = "Frozen Gemma 4 with typed logit probes and shared prefix caching"
requires-python = ">=3.12"
dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "huggingface-hub==1.31.0",
  "pillow>=12,<13",
  "vizdoom>=1.3,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
typesafe-gemma = "typesafe_gemma.cli:main"
typesafe-doom = "typesafe_gemma.doom.server:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
